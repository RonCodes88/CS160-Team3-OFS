services:
  migrate:
    build:
      context: .
      target: migrate
    env_file: .env.local
    init: true

  web:
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # Reliable file watching on Docker Desktop bind mounts.
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      # Keep the container's node_modules and build cache separate from the host's.
      - /app/node_modules
      - /app/.next

  delivery:
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [workers]
    build:
      context: .
      target: worker
    env_file: .env.local
    init: true
    restart: unless-stopped
    command: ["npm", "run", "delivery:worker"]

  recovery:
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [workers]
    build:
      context: .
      target: worker
    env_file: .env.local
    init: true
    restart: unless-stopped
    command: ["npm", "run", "recovery:worker"]
