name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      # Reuse Next.js's incremental build cache between runs.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', '*.ts', '*.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm run build

  # Runs the *.db.test.ts suites against a throwaway local Supabase. They skip
  # without SUPABASE_TEST_URL, so the check job above never exercises them.
  db-tests:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Applies supabase/migrations and seed.sql (the auth tests log in as the
      # seeded demo accounts). The tests only talk to Postgres through the API
      # gateway (Kong) and PostgREST, so skip the other containers. GoTrue stays:
      # without it the CLI does not report the API keys.
      - name: Start local Supabase
        run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Point the DB tests at local Supabase
        run: |
          eval "$(npx supabase status -o env)"
          if [ -z "$API_URL" ] || [ -z "$SECRET_KEY" ]; then
            echo "::error::supabase status did not report API_URL and SECRET_KEY"
            exit 1
          fi
          echo "::add-mask::$SECRET_KEY"
          echo "SUPABASE_TEST_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"

      - run: npm run test:db
      - name: Verify database transaction rollback
        run: npx supabase test db

  # The check job already proves the app builds. The Docker image can only
  # break when these files change, so skip the slow Docker build otherwise.
  # A job skipped via `if` still counts as passing for required checks.
  changes:
    name: Detect Docker-relevant changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR merge commit plus its first parent (the base branch).
          fetch-depth: 2

      - id: filter
        run: |
          if git diff --name-only HEAD^1 HEAD \
            | grep -qE '^(Dockerfile|\.dockerignore|compose\.yaml|package(-lock)?\.json|next\.config\.ts|\.nvmrc|\.github/workflows/)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: Docker build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
